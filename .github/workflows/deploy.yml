name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to webserver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Require host key fingerprint
        env:
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          if [[ -z "$DEPLOY_HOST_FINGERPRINT" ]]; then
            echo "::error::Secret DEPLOY_HOST_FINGERPRINT is not set; refusing to deploy without host key verification."
            exit 1
          fi

      - name: Deploy via SSH
        id: remote_deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 25m
          capture_stdout: true
          script: /srv/stacks/yawls/deploy.sh

      - name: Assert deploy finished successfully
        env:
          REMOTE_STDOUT: ${{ steps.remote_deploy.outputs.stdout }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REMOTE_STDOUT" | grep -Fq 'YAWLS_DEPLOY_OK'
