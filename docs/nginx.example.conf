# Example nginx vhost for YASL.
# Use when nginx runs in Docker on the shared external network `proxy`.

upstream yasl_app {
    server yasl:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ekz.mewes-im-netz.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ekz.mewes-im-netz.de;

    # ssl_certificate     /etc/letsencrypt/live/ekz.mewes-im-netz.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ekz.mewes-im-netz.de/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Accel-Buffering no;

    location / {
        proxy_pass http://yasl_app;
    }
}
